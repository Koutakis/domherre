[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domherre"
version = "0.1.1"
readme = "README.md"
license = { file = "LICENSE" }
description = "Redact Swedish names and personnummer from polars DataFrames"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "transformers>=5.0.0,<5.17.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
gliner = ["gliner>=0.2.0"]
presidio = ["presidio-analyzer>=2.2.0"]
dev = ["pytest>=7.0.0", "pandas>=2.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/domherre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
